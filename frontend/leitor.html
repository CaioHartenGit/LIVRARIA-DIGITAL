<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminaBooks — Leitor & Audiobook Studio</title>
    <link rel="stylesheet" href="css/style-layout.css">
    <link rel="stylesheet" href="css/style-components.css">
    <link rel="stylesheet" href="css/style-pages.css">
</head>
<body>
    <nav class="navbar">
        <a href="livros.html" class="nav-brand">
            <div class="nav-brand-icon">⬅️</div>
            <span>LuminaBooks • Voltar à Estante</span>
        </a>
        <div class="nav-actions">
            <div class="user-badge" id="leitor-progresso-badge">Sincronizando...</div>
        </div>
    </nav>

    <main class="reader-layout">
        <!-- Cabeçalho do Livro -->
        <div class="reader-top-bar">
            <div>
                <h2 id="titulo-livro">Carregando obra...</h2>
                <p id="subtitulo-pagina" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">
                    Página -- de --
                </p>
            </div>
            <div style="min-width: 240px;">
                <div class="book-meta">
                    <span id="status-conclusao">📖 Em leitura</span>
                    <strong id="porcentagem-leitura">0%</strong>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="barra-progresso" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Painel do Audiobook Studio -->
        <div class="audiobook-panel">
            <div class="audiobook-info">
                <div class="equalizer" id="audio-equalizer">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
                <div>
                    <strong>🎧 LuminaVox Audiobook Studio</strong>
                    <div class="audiobook-status" id="status-audio">Pronto para narrar esta página em Português</div>
                </div>
            </div>
            <div class="audiobook-controls">
                <label style="font-size: 0.82rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="auto-avancar" checked>
                    Auto-avançar pág.
                </label>
                <select id="velocidade-voz" class="speed-select" title="Velocidade da narração">
                    <option value="0.9">0.9x</option>
                    <option value="1" selected>1.0x (Normal)</option>
                    <option value="1.25">1.25x (Rápido)</option>
                    <option value="1.5">1.5x (Turbo)</option>
                </select>
                <button class="btn btn-accent" id="btn-play" onclick="iniciarAudiobook()">▶️ Ouvir Página</button>
                <button class="btn btn-outline" id="btn-pause" onclick="pausarOuRetomarAudio()">⏸️ Pausar</button>
                <button class="btn btn-danger" onclick="pararAudiobook()">⏹️ Parar</button>
            </div>
        </div>

        <!-- Barra de Personalização Visual (Estilo Kindle) -->
        <div class="reader-toolbar">
            <div class="toolbar-group">
                <span class="toolbar-label">Tema:</span>
                <button class="chip-btn active" id="tema-dark" onclick="mudarTemaPapel('dark')">🌙 Noturno</button>
                <button class="chip-btn" id="tema-sepia" onclick="mudarTemaPapel('sepia')">📜 Sépia</button>
                <button class="chip-btn" id="tema-light" onclick="mudarTemaPapel('light')">☀️ Claro</button>
            </div>

            <div class="toolbar-group">
                <span class="toolbar-label">Fonte:</span>
                <button class="chip-btn" id="fonte-sans" onclick="mudarFonte('sans')">Moderna</button>
                <button class="chip-btn active" id="fonte-serif" onclick="mudarFonte('serif')">Livro (Serif)</button>
                <button class="chip-btn" onclick="ajustarTamanhoFonte(-0.08)">A-</button>
                <button class="chip-btn" onclick="ajustarTamanhoFonte(0.08)">A+</button>
            </div>
        </div>

        <!-- Folha de Leitura do Livro -->
        <article class="page-paper font-serif" id="conteudo-pagina">
            Carregando texto da página...
        </article>

        <!-- Paginação Sincronizada com o Banco -->
        <div class="reader-pagination">
            <button class="btn btn-outline" id="btn-anterior" onclick="mudarPagina(-1)">
                ⬅️ Página Anterior
            </button>
            <span id="indicador-pagina" style="font-weight: 700;">Página 1</span>
            <button class="btn btn-primary" id="btn-proxima" onclick="mudarPagina(1)">
                Próxima Página ➡️
            </button>
        </div>
    </main>

    <script src="js/leitor.js"></script>
</body>
</html>
