<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria Digital — Estante de Livros</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="livros.html" class="nav-brand">
            <span>📚</span>
            <span>Livraria Digital</span>
        </a>
        <div class="nav-actions">
            <div class="user-badge" id="user-info">Carregando...</div>
            <button class="btn btn-primary" id="btn-novo-livro" onclick="abrirModalUpload()">+ Novo Livro (PDF)</button>
            <button class="btn btn-outline" onclick="sair()">Sair</button>
        </div>
    </nav>

    <main class="container">
        <div class="catalog-header">
            <div>
                <h2>Acervo Digital</h2>
                <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 4px;">
                    Escolha um livro para ler ou ouvir no modo Audiobook
                </p>
            </div>
            <div class="search-bar">
                <input type="text" id="input-busca" placeholder="Buscar livro por título..." onkeyup="filtrarPorTecla(event)">
                <button class="btn btn-primary" onclick="buscarLivros()">Buscar</button>
                <button class="btn btn-outline" onclick="carregarAcervo()">Todos</button>
            </div>
        </div>

        <div id="catalogo-alerta" class="alert-box"></div>

        <div class="books-grid" id="books-grid">
            <!-- Cards gerados via JS -->
        </div>
    </main>

    <!-- Modal de Upload de PDF -->
    <div class="modal-overlay" id="modal-upload">
        <div class="modal-box">
            <div class="modal-header">
                <h3>📤 Cadastrar Livro (PDF)</h3>
                <button class="btn btn-outline" style="padding: 6px 12px;" onclick="fecharModalUpload()">✕</button>
            </div>

            <div id="modal-alerta" class="alert-box"></div>

            <form id="form-upload" onsubmit="enviarNovoLivro(event)">
                <div class="form-group">
                    <label for="livro-titulo">Título do Livro</label>
                    <input type="text" id="livro-titulo" placeholder="Ex: Dom Casmurro" required>
                </div>
                <div class="form-group">
                    <label for="livro-autor">Autor</label>
                    <input type="text" id="livro-autor" placeholder="Ex: Machado de Assis" required>
                </div>
                <div class="form-group">
                    <label for="livro-arquivo">Arquivo PDF (Páginas contadas automaticamente)</label>
                    <input type="file" id="livro-arquivo" accept=".pdf" required>
                </div>
                <button type="submit" class="btn btn-accent btn-full" id="btn-submit-upload">
                    Enviar PDF e Cadastrar
                </button>
            </form>
        </div>
    </div>

    <script src="js/livros.js"></script>
</body>
</html>
